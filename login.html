<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>报价系统登录</title>
    <link rel="stylesheet" href="login.css?v=20260520-2">
  </head>
  <body>
    <main class="login-card">
      <h1>怡口报价系统</h1>
      <p>请登录后使用报价单和产品管理。</p>
      <form id="loginForm">
        <label>账号<input id="username" name="username" autocomplete="username" required></label>
        <label>密码<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">登录</button>
      </form>
      <div class="login-error" id="loginError"></div>
    </main>
    <script src="login.js?v=20260520-1"></script>
  </body>
</html>
